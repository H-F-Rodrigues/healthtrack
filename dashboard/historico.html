<!-- histórico -->
<section class="screen screen-historico">
    <header class="header">
        <div>
            <h2>Histórico de Consultas</h2>
            <p id="historico-subtitulo">Atendimentos anteriores da clínica</p>
        </div>

        <div class="search">
            <input id="busca-historico" type="search" placeholder="Buscar paciente, médico ou data..." aria-label="Buscar no histórico de consultas">
        </div>
    </header>

    <div class="table-card">
        <div class="table-header">
            <h2>Consultas anteriores</h2>
            <span id="historico-resumo"></span>
        </div>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>DATA</th>
                        <th>PACIENTE</th>
                        <th>MÉDICO</th>
                        <th>ESPECIALIDADE</th>
                        <th>DIAGNÓSTICO</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="historico-consultas"></tbody>
            </table>
        </div>
    </div>
</section>
