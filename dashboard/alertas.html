<!-- lembretes de medicação (médico) -->
<section class="screen screen-alertas">
    <header class="header">
        <div>
            <h2>Lembretes de medicação</h2>
            <p>Medicamentos que você prescreveu. O paciente vê esses lembretes no painel dele.</p>
        </div>

        <button id="btn-abrir-form-alerta" class="primary-button" type="button">+ Novo lembrete</button>
    </header>

    <form id="form-novo-alerta" class="content-card form-card" hidden>
        <div class="table-header">
            <h2>Nova prescrição</h2>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="alerta-paciente">Paciente</label>
                <select id="alerta-paciente" required></select>
            </div>
            <div class="form-group">
                <label for="alerta-medicamento">Medicamento</label>
                <select id="alerta-medicamento" required></select>
            </div>
            <div class="form-group">
                <label for="alerta-dosagem">Dosagem</label>
                <input id="alerta-dosagem" type="text" placeholder="Ex.: 50 mg, 1 comprimido" required>
            </div>
            <div class="form-group">
                <label for="alerta-horario">Horário</label>
                <input id="alerta-horario" type="text" placeholder="Ex.: 08:00 e 20:00" required>
            </div>
            <div class="form-group">
                <label for="alerta-inicio">Início</label>
                <input id="alerta-inicio" type="date" required>
            </div>
            <div class="form-group">
                <label for="alerta-fim">Fim</label>
                <input id="alerta-fim" type="date" required>
            </div>
            <div class="form-group form-group-checkbox">
                <label for="alerta-sem-fim">
                    <input id="alerta-sem-fim" type="checkbox">
                    Sem data de término
                </label>
            </div>
        </div>

        <p class="login-error" id="erro-alerta" hidden></p>
        <div class="form-actions">
            <button class="outline-button" id="btn-cancelar-form-alerta" type="button">Voltar</button>
            <button class="primary-button" type="submit">Salvar lembrete</button>
        </div>
    </form>

    <div class="filtro-abas" role="group" aria-label="Filtrar lembretes">
        <button type="button" class="aba ativa" data-filtro="ativos">Em uso</button>
        <button type="button" class="aba" data-filtro="encerrados">Encerrados</button>
        <button type="button" class="aba" data-filtro="todos">Todos</button>
    </div>

    <div class="alerts-container" id="lista-alertas"></div>
</section>
